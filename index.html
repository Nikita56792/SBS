<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sirius Biotech Summit — App</title>
  <meta name="description" content="Sirius Biotech Summit (SBS) event app — schedule, speakers and news feed.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-192.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#5b3fd4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="promo">
    <div class="promo__inner">

      <div class="promo__info">
        <header class="promo__header">
          <img class="promo__logo" src="assets/logo.jpg" alt="SBS logo" width="64" height="64">
          <h1 class="promo__title" data-i18n="title">Sirius Biotech Summit</h1>
        </header>

        <div class="promo__qr">
          <a class="promo__qr__img" id="qrLink" href="https://158.160.205.107/app/" aria-label="Open the web app">
            <img src="assets/qr.svg" alt="QR: https://nikita56792.github.io/SBS" width="132" height="132">
          </a>
          <p class="promo__qr__text" data-i18n="qrText">To install the app, open this page on your mobile device or scan this QR code</p>
        </div>

        <a class="promo__download" id="downloadBtn" href="https://158.160.205.107/app/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
          <span data-i18n="download">Open the app</span>
        </a>

        <div class="promo__adv">
          <div class="promo__adv__item">
            <div class="promo__adv__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#2b6ef2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span data-i18n="adv1">Stay tuned for schedule updates</span>
          </div>
          <div class="promo__adv__item">
            <div class="promo__adv__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#2b6ef2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span data-i18n="adv2">Get all information about the event</span>
          </div>
          <div class="promo__adv__item">
            <div class="promo__adv__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#2b6ef2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span data-i18n="adv3">Ask questions to speakers</span>
          </div>
          <div class="promo__adv__item">
            <div class="promo__adv__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="#2b6ef2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span data-i18n="adv4">Share your impressions in the news feed</span>
          </div>
        </div>

        <footer class="promo__footer">
          <span data-i18n="poweredBy">Powered by</span>
          <span class="promo__footer__brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.6l6.1-.8z"/></svg>
            <span data-i18n="poweredTech">Web Technologies</span>
          </span>
        </footer>
      </div>

      <div class="promo__phones">
        <img src="assets/phones.png" alt="SBS app on phones" width="900" height="1207" loading="lazy">
      </div>

    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
